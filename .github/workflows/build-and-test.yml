name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (native on M1/M2 runners)
          - os: macos-latest
            goos: darwin
            goarch: arm64
            lib_ext: dylib
            wheel_plat: macosx_11_0_arm64

          # macOS x86_64 (Intel)
          - os: macos-12
            goos: darwin
            goarch: amd64
            lib_ext: dylib
            wheel_plat: macosx_10_13_x86_64

          # Linux x86_64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            lib_ext: so
            wheel_plat: manylinux_2_35_x86_64

          # Linux arm64 (GitHub has native arm64 runners)
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            lib_ext: so
            wheel_plat: manylinux_2_35_aarch64

          # Windows x86_64
          - os: windows-latest
            goos: windows
            goarch: amd64
            lib_ext: dll
            wheel_plat: win_amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build tools
        run: pip install setuptools wheel build

      - name: Build Go c-archive
        working-directory: _src_c/go
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          mkdir -p ../build
          go test -v ./...
          go build -buildmode=c-archive -o ../build/libkagome.a ./main.go
          echo "=== Build output ==="
          ls -la ../build/

      - name: Build shared library
        working-directory: _src_c
        shell: bash
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            gcc -fPIC -fvisibility=hidden -shared \
              ./c/kagome_wrapper.c ./build/libkagome.a \
              -o ./build/libkagome.${{ matrix.lib_ext }} \
              -lwinmm -lws2_32 -lntdll
          else
            cc -fPIC -fvisibility=hidden -shared \
              ./c/kagome_wrapper.c ./build/libkagome.a \
              -o ./build/libkagome.${{ matrix.lib_ext }}
          fi

      - name: Stage library into package
        shell: bash
        run: |
          mkdir -p src/libkagome/lib
          if [ -d "_src_c/build" ]; then
            ls -la _src_c/build/
            cp "_src_c/build/libkagome.${{ matrix.lib_ext }}" \
               "src/libkagome/lib/libkagome.${{ matrix.lib_ext }}"
            ls -la src/libkagome/lib/
          else
            echo "ERROR: _src_c/build/ directory not found"
            exit 1
          fi

      - name: Build wheel
        shell: bash
        run: |
          mkdir -p dist
          python3 -m pip wheel . --no-deps --wheel-dir ./dist/
          echo "=== Initial wheel ==="
          ls -la dist/ || echo "dist/ is empty"

      - name: Re-tag wheel with correct platform
        shell: bash
        run: |
          pip install wheel
          WHL_FILE=$(ls dist/*.whl 2>/dev/null | head -1)
          if [ -z "$WHL_FILE" ]; then
            echo "ERROR: No .whl file found in dist/"
            ls -la dist/
            exit 1
          fi
          python3 -m wheel tags --platform-tag ${{ matrix.wheel_plat }} "$WHL_FILE" --remove
          echo "=== Re-tagged wheel ==="
          ls -la dist/

      - name: Verify wheel contents
        shell: bash
        run: |
          echo "=== Wheel contents ==="
          unzip -l dist/*.whl | head -20

      - name: Install wheel and test
        run: |
          import subprocess
          import sys
          import os
          from pathlib import Path

          venv_path = Path("test_venv")
          venv_path.mkdir(exist_ok=True)

          # Create venv
          subprocess.run([sys.executable, "-m", "venv", str(venv_path)], check=True)

          # Get python executable in venv
          if sys.platform == "win32":
            python_exe = venv_path / "Scripts" / "python.exe"
            pip_exe = venv_path / "Scripts" / "pip.exe"
          else:
            python_exe = venv_path / "bin" / "python"
            pip_exe = venv_path / "bin" / "pip"

          # Find and install wheel
          wheels = list(Path("dist").glob("*.whl"))
          if not wheels:
            raise RuntimeError("No wheel file found in dist/")

          wheel_path = wheels[0]
          print(f"Installing wheel: {wheel_path}")
          subprocess.run([str(pip_exe), "install", str(wheel_path)], check=True)

          # Run tests
          print("Running tests...")
          subprocess.run([str(python_exe), "tests/libkagome_test.py"], check=True)
        shell: python

      - name: Verify manylinux compliance (Linux only)
        if: runner.os == 'Linux'
        run: |
          pip install auditwheel
          echo "=== Wheel manylinux compliance check ==="
          auditwheel show dist/*.whl || echo "Note: auditwheel check completed"
          echo "=== Wheel info ==="
          unzip -l dist/*.whl | head -20

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.whl
