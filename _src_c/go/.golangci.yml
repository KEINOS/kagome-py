# DO NOT EDIT THIS FILE without any confirmation from maintainers.
version: "2"

run:
  tests: true
  allow-parallel-runners: true

linters:
  default: all
  exclusions:
    paths:
      - .github
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/ikawaha/kagome/v2
            - github.com/ikawaha/kagome-dict
            - github.com/stretchr/testify
            - github.com/KEINOS/kagome-py/libkagome/internal/cgotest
    funlen:
      lines: 130  # Accommodate cgo-generated wrappers (~125 lines)
    varnamelen:
      min-name-length: 1
      check-receiver: false
      check-return: false
  disable:
    # Disabled due to wsl_v5
    - wsl
    # Disabled due to testing private function purpose
    - testpackage
    # Disabled due to testing multi-byte character handling
    - gosmopolitan
    # Disabled due to cgo-generated wrapper functions
    - nolintlint
    - nonamedreturns  # cgo-generated wrappers use unnamed returns
    - nlreturn        # cgo-generated code doesn't follow our style rules
