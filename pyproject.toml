[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kagome-py"
version = "2.10.3"
description = "Python bindings for kagome, a Japanese morphological analyzer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "KEINOS", email = "github@keinos.com"},
]
keywords = ["japanese", "morphological-analysis", "tokenizer", "nlp", "kagome"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/KEINOS/kagome-py"
Repository = "https://github.com/KEINOS/kagome-py"
Issues = "https://github.com/KEINOS/kagome-py/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libkagome = ["lib/*"]
